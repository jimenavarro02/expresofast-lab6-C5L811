<div class="container mt-4">
  <h2>Registrar Nuevo Envío</h2>

  <div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form [formGroup]="envioForm" (ngSubmit)="registrar()">
    <!-- Número de rastreo -->
    <div class="mb-3">
      <label for="numeroRastreo" class="form-label">Número de Rastreo</label>
      <input 
        type="text" 
        id="numeroRastreo" 
        formControlName="numeroRastreo" 
        class="form-control" 
        placeholder="Ej: RASTREO-123"
      >
    </div>

    <hr>
    
    <!-- Sección dinámica de Paquetes (FormArray) -->
    <h4>Paquetes del Envío</h4>
    <div formArrayName="paquetes">
      <div *ngFor="let paquete of paquetes.controls; let i = index" [formGroupName]="i" class="card p-3 mb-3 bg-light">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong>Paquete #{{ i + 1 }}</strong>
          <button 
            type="button" 
            class="btn btn-danger btn-sm" 
            (click)="eliminarPaquete(i)" 
            *ngIf="paquetes.length > 1">
            Eliminar
          </button>
        </div>

        <div class="mb-2">
          <label class="form-label">Descripción</label>
          <input type="text" formControlName="descripcion" class="form-control" placeholder="Ej: Caja mediana">
        </div>

        <div class="mb-2">
          <label class="form-label">Peso (kg)</label>
          <input type="number" step="0.1" formControlName="peso" class="form-control" placeholder="Ej: 2.5">
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-secondary mb-3" (click)="agregarPaquete()">
      + Agregar Otro Paquete
    </button>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Registrar Envío' }}
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="volver()">
        Volver
      </button>
    </div>
  </form>
</div>

<section class="formulario">
  <h1>Registrar nuevo envío</h1>
  <p>Complete los datos básicos de la guía.</p>

  <form (ngSubmit)="registrar()">
    <label>
      Destinatario
      <input
        type="text"
        name="destinatario"
        [(ngModel)]="destinatario"
        required>
    </label>

    <label>
      Dirección de destino
      <input
        type="text"
        name="direccionDestino"
        [(ngModel)]="direccionDestino"
        required>
    </label>

    <label>
      Monto del flete
      <input
        type="number"
        name="montoFlete"
        [(ngModel)]="montoFlete"
        min="0.01"
        step="0.01"
        required>
    </label>

    <p class="exito" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="acciones">
      <button type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Registrar envío' }}
      </button>
      <button type="button" class="secundario" (click)="volver()">Volver</button>
    </div>
  </form>
</section>
