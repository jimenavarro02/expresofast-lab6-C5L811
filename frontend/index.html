<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Inicio de sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

    <header class="login-header">
        <p class="brand">ExpresoFast</p>
        <p class="tagline">Consola de Operación Logística</p>
    </header>

    <main class="login-main">
        <section class="login-panel" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Iniciar sesión</h1>
            <p class="login-subtitle">Ingrese sus credenciales para acceder al tablero de control.</p>

            <form id="loginForm" novalidate>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Ingresar</button>
            </form>

            <p id="loginError" class="alert alert-error" role="alert" aria-live="polite"></p>
        </section>
    </main>

    <footer class="login-footer">
        <p>&copy; 2026 ExpresoFast. Todos los derechos reservados.</p>
        <p><a href="mailto:soporte@expresofast.cr">soporte@expresofast.cr</a></p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
