<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ExpresoFast - Tablero</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>ExpresoFast</h1>
        <div><span id="userInfo"></span><button id="logoutBtn">Cerrar sesión</button></div>
    </header>
    <main>
        <section id="adminPanel" class="panel">
            <h2>Nuevo envío</h2>
            <form id="envioForm" class="grid">
                <input id="codigo" placeholder="EXP-1234" required><input id="direccion" placeholder="Dirección destino"
                    required>
                <input id="peso" type="number" step="0.01" min="0.01" placeholder="Peso kg" required><input id="costo"
                    type="number" step="0.01" min="0.01" placeholder="Costo" required>
                <input id="vehiculoId" type="number" min="1" placeholder="ID vehículo" required><input id="conductorId"
                    type="number" min="1" placeholder="ID conductor" required>
                <button>Crear envío</button>
            </form>
        </section>
        <section>
            <h2>Envíos</h2>
            <div id="envios" class="cards"></div>
        </section>
    </main>
    <div id="modal" class="modal">
        <div class="modal-box"><button id="closeModal" class="close">×</button>
            <h2>Bitácora</h2>
            <div class="filters"><label>Desde<input type="date" id="desde"></label><label>Hasta<input type="date"
                        id="hasta"></label></div>
            <div id="bitacora"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
