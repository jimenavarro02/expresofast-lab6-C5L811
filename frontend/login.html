<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ExpresoFast - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">
    <main class="login-card">
        <h1>ExpresoFast</h1>
        <p>Inicio de sesión</p>
        <form id="loginForm"><label>Usuario<input id="username" required autocomplete="username"></label>
            <label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label>
            <button type="submit">Ingresar</button>
            <p id="loginError" class="error"></p>
        </form>
    </main>
    <script src="app.js"></script>
</body>

</html>
